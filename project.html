<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Golden Calf</title>
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* ── VIEW TRANSITIONS ── */
@media (hover: hover) {
  ::view-transition-old(project-hero) { animation: 480ms cubic-bezier(0.4,0,0.2,1) both vt-out; }
  ::view-transition-new(project-hero) { animation: 680ms cubic-bezier(0.16,1,0.3,1) both vt-in; }
  ::view-transition-old(root) { animation: 280ms ease both vt-out; }
  ::view-transition-new(root) { animation: 420ms ease both vt-in; }
}
@media (hover: none) {
  ::view-transition-old(root) { animation: 300ms ease both vt-out; }
  ::view-transition-new(root) { animation: 400ms ease 260ms both vt-in; }
  :root { background: #0d0e0c; }
}
@keyframes vt-in  { from { opacity:0; } }
@keyframes vt-out { to   { opacity:0; } }

/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black:   #0d0e0c;
  --dark:    #141512;
  --gold:    #b8924a;
  --gold-dim:#6b5428;
  --muted:   #5c5a54;
  --white:   #f0ece4;
  --nav-bg:  #cdc5b4;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'EB Garamond', Georgia, serif;
  background: var(--black);
  color: var(--white);
  overflow-x: hidden;
  cursor: default;
}
body::before {
  content:''; position:fixed; inset:0; z-index:999;
  pointer-events:none; opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}

/* ── NAV ── */
.nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  background:var(--nav-bg);
  display:flex; justify-content:center; gap:3rem; padding:.85rem 2rem;
}
.nav a {
  font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.2em;
  color:#3a3830; text-decoration:none; opacity:.65; transition:opacity .2s;
}
.nav a:hover { opacity:1; }
/* hamburger hidden on desktop */
.hamburger { display:none; }

/* ── PASSWORD GATE ── */
.gate {
  position:fixed; inset:0; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--black);
  transition:opacity 1.1s cubic-bezier(.4,0,.2,1);
}
.gate.dissolve { opacity:0; pointer-events:none; }
.gate-orbs { position:absolute; inset:0; overflow:hidden; }
.gate-orb {
  position:absolute; border-radius:50%;
  filter:blur(90px); mix-blend-mode:screen;
}
.gate-orb-1 {
  width:70vmax; height:70vmax; top:-20vmax; left:-15vmax;
  background:radial-gradient(ellipse, rgba(20,40,90,.55) 0%, transparent 70%);
  animation:gOrb1 18s ease-in-out infinite alternate;
}
.gate-orb-2 {
  width:60vmax; height:60vmax; bottom:-20vmax; right:-10vmax;
  background:radial-gradient(ellipse, rgba(80,42,8,.45) 0%, transparent 70%);
  animation:gOrb2 22s ease-in-out infinite alternate;
}
.gate-orb-3 {
  width:40vmax; height:40vmax; top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse, rgba(184,146,74,.07) 0%, transparent 60%);
  animation:gOrb3 6s ease-in-out infinite;
}
@keyframes gOrb1 { from{transform:translate(0,0)} to{transform:translate(12vw,8vh)} }
@keyframes gOrb2 { from{transform:translate(0,0)} to{transform:translate(-8vw,-6vh)} }
@keyframes gOrb3 {
  0%,100%{transform:translate(-50%,-50%) scale(1); opacity:.4}
  50%{transform:translate(-50%,-50%) scale(1.5); opacity:1}
}
.gate-vignette {
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(13,14,12,.7) 70%, rgba(13,14,12,.95) 100%);
}
.gate-content {
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
}
.gate-logo {
  width:44px; height:44px; margin-bottom:2rem;
  filter:brightness(0) invert(1) opacity(.45);
  opacity:0; animation:gRise .9s cubic-bezier(.16,1,.3,1) .1s forwards;
}
.gate-name {
  font-family:'Cinzel',serif; font-size:.55rem; letter-spacing:.4em;
  color:var(--muted); margin-bottom:3rem;
  opacity:0; animation:gRise .9s cubic-bezier(.16,1,.3,1) .25s forwards;
}
.gate-ornament {
  display:flex; align-items:center; gap:1rem; margin-bottom:1rem;
  opacity:0; animation:gRise .9s cubic-bezier(.16,1,.3,1) .35s forwards;
}
.gate-ornament::before,.gate-ornament::after {
  content:''; display:block; width:48px; height:1px;
  background:linear-gradient(to right,transparent,#252722);
}
.gate-ornament::after { background:linear-gradient(to left,transparent,#252722); }
.gate-ornament span { font-size:.45rem; color:#252722; }
.gate-field {
  position:relative; width:220px;
  opacity:0; animation:gRise .9s cubic-bezier(.16,1,.3,1) .45s forwards;
}
.gate-field input {
  width:100%; background:none; border:none;
  border-bottom:1px solid #1e2018; outline:none;
  padding:.7rem 0;
  font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:300;
  letter-spacing:.5em; color:var(--white); text-align:center; caret-color:var(--gold);
}
.gate-field input::placeholder {
  font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:.28em; color:var(--muted);
}
.gate-field::after {
  content:''; position:absolute; bottom:0; left:50%;
  width:0; height:1px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
  transform:translateX(-50%); transition:width .55s cubic-bezier(.16,1,.3,1);
}
.gate-field:focus-within::after { width:100%; }
.gate-field::before {
  content:''; position:absolute; bottom:-14px; left:50%;
  transform:translateX(-50%); width:50%; height:20px;
  background:var(--gold); filter:blur(20px); opacity:0;
  transition:opacity .5s; pointer-events:none;
}
.gate-field:focus-within::before { opacity:.12; }
.gate-hint {
  margin-top:1.2rem; font-family:'Cinzel',serif;
  font-size:.48rem; letter-spacing:.22em;
  color:transparent; height:.7rem; text-align:center; transition:color .3s;
}
.gate-hint.show { color:rgba(184,146,74,.4); }
.gate-enter {
  margin-top:2.5rem; font-family:'Cinzel',serif;
  font-size:.52rem; letter-spacing:.26em;
  color:var(--muted); background:none; border:none; cursor:pointer;
  padding:.4rem 0; position:relative; transition:color .3s;
  opacity:0; animation:gRise .9s cubic-bezier(.16,1,.3,1) .6s forwards;
}
.gate-enter::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(to right,transparent,var(--gold-dim),transparent);
  transform:scaleX(0); transition:transform .4s cubic-bezier(.16,1,.3,1);
}
.gate-enter:hover { color:var(--gold); }
.gate-enter:hover::after { transform:scaleX(1); }
@keyframes gRise {
  from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)}
}

/* ── MEDIA WRAPPERS ── */
.vm {
  position:absolute; inset:0; overflow:hidden;
  background:#050608; display:block;
}
.vm iframe {
  /* background=1 crops server-side; iframe just fills */
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  border:0; outline:none; pointer-events:none; display:block;
}
.vm::after { content:''; position:absolute; inset:0; z-index:1; }
.im { position:absolute; inset:0; overflow:hidden; display:block; }
.im img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.im::after { content:''; position:absolute; inset:0; z-index:1; }

/* ── HERO ── */
.hero {
  position:relative; height:100vh;
  overflow:hidden; margin-top:44px;
}
.hero .vm { position:absolute; inset:0; }
.hero .vm iframe {
  /* hero needs cover — oversized and centered */
  position:absolute; top:50%; left:50%;
  width:177.78%; height:177.78%;
  min-width:100%; min-height:100%;
  transform:translate(-50%,-50%);
  border:none; pointer-events:none;
}
.hero-vignette {
  position:absolute; inset:0; z-index:2;
  background:
    linear-gradient(to top, rgba(13,14,12,.95) 0%, rgba(13,14,12,.1) 45%, transparent 70%),
    linear-gradient(to right, rgba(13,14,12,.4) 0%, transparent 55%),
    linear-gradient(to bottom, rgba(13,14,12,.5) 0%, transparent 35%);
}
.hero-title { position:absolute; bottom:5.5rem; left:7vw; z-index:3; }
.hero-title .eyebrow {
  display:block; font-family:'Cinzel',serif; font-size:.6rem; letter-spacing:.3em;
  color:var(--gold); margin-bottom:1rem;
  opacity:0; animation:fadeUp 1s ease 1.6s forwards;
}
.hero-title h1 {
  font-family:'Cormorant Garamond',serif; font-weight:300;
  font-size:clamp(3.2rem,7vw,7rem); line-height:.93; letter-spacing:-.02em;
  opacity:0; animation:fadeUp 1.2s ease 1.8s forwards;
}
.hero-title h1 em { font-style:italic; color:rgba(240,236,228,.38); display:block; }
.hero-aside {
  position:absolute; bottom:6rem; right:6vw; text-align:right; z-index:3;
  opacity:0; animation:fadeUp 1s ease 2.2s forwards;
}
.hero-aside span {
  display:block; font-family:'Cinzel',serif;
  font-size:.55rem; letter-spacing:.2em; color:var(--muted); line-height:2.1;
}
.scroll-cue {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:1px; height:72px;
  background:linear-gradient(to bottom,transparent,var(--gold-dim));
  opacity:0; animation:fadeIn 1s ease 2.7s forwards;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { to{opacity:1} }

/* ── INTRO ── */
.intro {
  padding:8rem 7vw 0;
  display:grid; grid-template-columns:55% 1fr; gap:6vw; align-items:start;
}
.intro-body { font-size:1.1rem; line-height:1.9; color:rgba(240,236,228,.68); }
.intro-pull {
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300;
  font-size:clamp(1.4rem,2.2vw,2.1rem); line-height:1.35;
  color:rgba(240,236,228,.38);
  border-left:1px solid var(--gold-dim); padding-left:2rem;
}

/* ── CANVAS ── */
.canvas { position:relative; padding-bottom:6rem; }

/* reveal on scroll */
.item {
  position:relative;
  opacity:0; transform:translateY(22px);
  transition:opacity .75s ease, transform .75s ease;
  will-change:transform,opacity;
}
.item.on { opacity:1; transform:translateY(0); }

.cap {
  font-family:'EB Garamond',serif; font-style:italic;
  font-size:.82rem; color:var(--muted); line-height:1.55;
  padding-top:.55rem; max-width:32ch; transition:color .3s;
}
.item:hover .cap { color:rgba(240,236,228,.5); }
.float-text p {
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300;
  font-size:clamp(1.2rem,1.9vw,2rem); line-height:1.3;
  color:rgba(240,236,228,.82); text-shadow:0 2px 20px rgba(0,0,0,.9);
}

/* ── SCENE LAYOUTS ── */
/* Each .scene-* is generated by JS based on media count */

/* SCENE A — single large, bleeds left. small overlaps from right */
.scene-a { position:relative; height:100vh; margin-top:7rem; }
.sa-main  { position:absolute; left:0; top:6vh; width:75vw; height:86vh; z-index:1; }
.sa-over  {
  position:absolute; right:2vw; top:8vh; width:28vw; height:38vh; z-index:3;
  transition-delay:.18s; box-shadow:-12px 12px 40px rgba(0,0,0,.8);
}
.sa-cap   { position:absolute; bottom:5vh; left:7vw; z-index:4; transition-delay:.3s; }

/* SCENE B — two videos colliding, text over seam */
.scene-b { position:relative; height:90vh; margin-top:8rem; }
.sb-left  { position:absolute; left:4vw; top:6vh; width:54vw; height:72vh; z-index:2; box-shadow:20px 20px 60px rgba(0,0,0,.8); }
.sb-right { position:absolute; right:3vw; top:26vh; width:30vw; height:42vh; z-index:3; transition-delay:.14s; box-shadow:-12px 12px 40px rgba(0,0,0,.7); }
.sb-text  { position:absolute; left:52vw; top:4vh; z-index:5; max-width:18ch; transition-delay:.28s; }

/* SCENE C — large center, two smalls punch in from edges */
.scene-c  { position:relative; height:90vh; margin-top:5rem; }
.sc-main  { position:absolute; left:4vw; top:3vh; width:58vw; height:82vh; z-index:2; }
.sc-punch { position:absolute; right:3vw; bottom:6vh; width:38vw; height:48vh; z-index:3; transition-delay:.16s; box-shadow:-14px 14px 50px rgba(0,0,0,.85); }
.sc-cap   { position:absolute; bottom:0; left:4vw; z-index:5; transition-delay:.3s; }

/* SCENE D — full bleed panoramic, small punches top-right */
.scene-d  { position:relative; height:80vh; margin-top:5rem; }
.sd-pan   { position:absolute; left:0; right:0; top:4vh; height:74vh; z-index:1; overflow:hidden; }
.sd-punch { position:absolute; right:8vw; top:0; width:22vw; height:28vh; z-index:3; transition-delay:.2s; box-shadow:0 20px 60px rgba(0,0,0,.9); }
.sd-cap   { position:absolute; bottom:1vh; left:7vw; z-index:4; transition-delay:.15s; }

/* SCENE E — portrait left, landscape overlapping right */
.scene-e     { position:relative; height:90vh; margin-top:5rem; }
.se-portrait { position:absolute; left:5vw; top:4vh; width:34vw; height:65vh; z-index:2; }
.se-landscape{ position:absolute; right:4vw; top:12vh; width:56vw; height:52vh; z-index:3; transition-delay:.12s; box-shadow:-18px 10px 55px rgba(0,0,0,.8); }
.se-cap      { position:absolute; bottom:4vh; right:4vw; z-index:5; text-align:right; transition-delay:.25s; }

/* SCENE F — single hero-width standalone */
.scene-f  { position:relative; height:70vh; margin-top:5rem; }
.sf-main  { position:absolute; left:8vw; right:8vw; top:0; bottom:0; z-index:1; }
.sf-cap   { position:absolute; bottom:-2rem; left:8vw; z-index:4; transition-delay:.15s; }

/* ── CLOSING ── */
.closing {
  margin-top:8rem; padding:3rem 7vw 7rem;
  border-top:1px solid #1c1e1a;
  display:flex; justify-content:space-between; align-items:flex-end;
}
.closing-tags { display:flex; flex-direction:column; gap:.4rem; }
.closing-tags span { font-family:'Cinzel',serif; font-size:.55rem; letter-spacing:.2em; color:var(--muted); }
.more-work {
  font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.2em;
  color:var(--gold); text-decoration:none;
  border-bottom:1px solid var(--gold-dim); padding-bottom:.2rem;
  transition:color .2s,border-color .2s;
}
.more-work:hover { color:var(--white); border-color:var(--white); }

/* ── FOOTER ── */
.site-footer {
  padding:2rem 7vw; border-top:1px solid #1a1c18;
  display:flex; align-items:center; gap:1.5rem;
}
.footer-mark { font-size:1rem; color:var(--muted); }
.footer-est  { font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:.2em; color:var(--muted); }
.footer-email{ font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:.15em; color:var(--muted); text-decoration:none; transition:color .2s; }
.footer-email:hover { color:var(--gold); }

/* ════════════════════════════════
   MOBILE ≤ 768px
════════════════════════════════ */
@media (max-width:768px) {
  .nav { gap:1.5rem; padding:.75rem 1.5rem; }
  .nav a { font-size:.62rem; letter-spacing:.14em; }

  .hero { height:100svh; }
  .hero-title { bottom:4rem; left:6vw; }
  .hero-title h1 { font-size:clamp(2.8rem,11vw,4rem); }
  .hero-aside { display:none; }

  .intro { grid-template-columns:1fr; padding:4rem 6vw 0; gap:2rem; }
  .intro-pull { font-size:clamp(1.3rem,5vw,1.7rem); padding-left:1.2rem; }

  /* all scenes → vertical flow */
  .scene-a,.scene-b,.scene-c,.scene-d,.scene-e,.scene-f {
    position:relative; height:auto; margin-top:0;
    display:flex; flex-direction:column; gap:0; padding:3rem 0 0;
  }

  /* reset all absolute items to flow */
  .item {
    position:relative !important;
    width:auto !important; height:auto !important;
    top:auto !important; left:auto !important;
    right:auto !important; bottom:auto !important;
    z-index:auto !important; box-shadow:none !important;
    transform:translateY(22px) !important;
  }
  .item.on { transform:translateY(0) !important; }

  /* all media fills need explicit height */
  .vm, .im { position:relative !important; height:56vw; min-height:180px; }
  .vm iframe { position:absolute; width:100%; height:100%; top:50%; left:50%; width:177.78%; height:177.78%; transform:translate(-50%,-50%); }

  /* ── Scene A mobile ── */
  .sa-main { width:100% !important; margin-bottom:-16vw; }
  .sa-main .vm { height:60vw; }
  .sa-over { width:58% !important; align-self:flex-end; box-shadow:-8px -8px 28px rgba(0,0,0,.75) !important; }
  .sa-over .vm { height:40vw; }
  .sa-cap { padding:1rem 6vw 0; }

  /* ── Scene B mobile ── */
  .sb-left { width:100% !important; margin-bottom:-14vw; }
  .sb-left .vm { height:62vw; }
  .sb-right { width:62% !important; align-self:flex-start; margin-left:5vw; box-shadow:8px -8px 28px rgba(0,0,0,.75) !important; }
  .sb-right .vm { height:44vw; }
  .sb-text { transform:none !important; left:auto !important; padding:1.5rem 6vw 0; align-self:flex-start; }
  .sb-text p { font-size:1.2rem; }

  /* ── Scene C mobile ── */
  .sc-main { width:100% !important; margin-bottom:-16vw; }
  .sc-main .vm { height:62vw; }
  .sc-punch { width:60% !important; align-self:flex-end; box-shadow:-8px -8px 28px rgba(0,0,0,.8) !important; }
  .sc-punch .vm { height:42vw; }
  .sc-cap { padding:1rem 6vw 0; }

  /* ── Scene D mobile ── */
  .sd-pan { width:100% !important; margin-bottom:-16vw; }
  .sd-pan .vm { height:60vw; }
  .sd-punch { width:50% !important; align-self:flex-end; margin-right:4vw; box-shadow:-6px -6px 26px rgba(0,0,0,.85) !important; }
  .sd-punch .vm { height:34vw; }
  .sd-cap { padding:1rem 6vw 0; }

  /* ── Scene E mobile ── */
  .se-portrait { width:100% !important; margin-bottom:-12vw; }
  .se-portrait .vm,.se-portrait .im { height:72vw; }
  .se-landscape { width:78% !important; align-self:flex-end; box-shadow:-8px -8px 28px rgba(0,0,0,.8) !important; }
  .se-landscape .vm,.se-landscape .im { height:52vw; }
  .se-cap { text-align:left !important; padding:1rem 6vw 0; right:auto !important; }

  /* ── Scene F mobile ── */
  .sf-main { left:0 !important; right:0 !important; }
  .sf-main .vm,.sf-main .im { height:62vw; }
  .sf-cap { left:6vw !important; padding-top:1rem; }

  /* closing */
  .closing { flex-direction:column; align-items:flex-start; gap:2rem; padding:3rem 6vw 5rem; margin-top:4rem; }
}
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="nav">
  <a href="index.html">W.O.R.K</a>
  <a href="about.html">A.B.O.U.T</a>
  <a href="resume.html">R.E.S.U.M.E</a>
</nav>

<!-- ── PASSWORD GATE (shown only for protected projects) ── -->
<div class="gate" id="gate" style="display:none;">
  <div class="gate-orbs">
    <div class="gate-orb gate-orb-1"></div>
    <div class="gate-orb gate-orb-2"></div>
    <div class="gate-orb gate-orb-3"></div>
  </div>
  <div class="gate-vignette"></div>
  <div class="gate-content">
    <img class="gate-logo" src="images/logo-mark.png" alt="A Golden Calf" />
    <p class="gate-name">A GOLDEN CALF</p>
    <div class="gate-ornament"><span>✦</span></div>
    <div class="gate-field">
      <input type="password" id="gate-pwd" placeholder="ENTER PASSWORD"
             autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
    <p class="gate-hint" id="gate-hint">INCORRECT</p>
    <button class="gate-enter" id="gate-enter">ENTER &nbsp;→</button>
  </div>
</div>

<!-- ── PAGE CONTENT (built by JS) ── -->
<div id="page-content" style="opacity:0; transition:opacity .6s ease;"></div>

<!-- ── FOOTER ── -->
<footer class="site-footer">
  <span class="footer-mark">&#9775;&#xFE0E;</span>
  <span class="footer-est">EST.BC</span>
  <a href="mailto:hello@agoldencalf.com" class="footer-email">hello@agoldencalf.com</a>
</footer>

<script>
/* ════════════════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════════════════ */
const GATE_PASSWORD    = 'golden';       // ← change this
const PROTECTED_IDS    = [0, 1];         // project indexes that need password
const PROJECTS_JSON    = 'content/projects.json';

/* ════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════ */
function setCookie(n,v,d){
  const e=new Date(); e.setTime(e.getTime()+d*864e5);
  document.cookie=`${n}=${v};expires=${e.toUTCString()};path=/;SameSite=Strict`;
}
function getCookie(n){
  const m=document.cookie.match(new RegExp('(^| )'+n+'=([^;]+)'));
  return m?m[2]:null;
}
function getProjectId(){
  return parseInt(new URLSearchParams(location.search).get('id')||'0',10);
}

/* ════════════════════════════════════════════════════════
   MEDIA RENDERER
   Vimeo: src starts with 'https://player.vimeo' or is a numeric ID
   Image: type === 'image'
════════════════════════════════════════════════════════ */
function isVimeo(src){
  return src && (src.includes('vimeo.com') || /^\d{7,10}$/.test(src.trim()));
}
function getVimeoId(src){
  if(/^\d{7,10}$/.test(src.trim())) return src.trim();
  const m = src.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}

function makeVimeoEmbed(src, cls=''){
  const id = getVimeoId(src);
  if(!id) return '';
  return `<div class="vm${cls?` ${cls}`:''}">
    <iframe src="https://player.vimeo.com/video/${id}?background=1&autoplay=1&loop=1&muted=1&controls=0&title=0&byline=0&portrait=0&dnt=1"
            allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>`;
}

function makeImageEmbed(src, alt='', cls=''){
  return `<div class="im${cls?` ${cls}`:''}">
    <img src="${src}" alt="${alt}" loading="lazy" />
  </div>`;
}

function makeMedia(item, cls=''){
  if(!item || !item.url) return '';
  if(item.type==='image' || (!isVimeo(item.url) && item.url.match(/\.(jpg|jpeg|png|webp|gif)/i))){
    return makeImageEmbed(item.url, item.caption||'', cls);
  }
  return makeVimeoEmbed(item.url, cls);
}

/* ════════════════════════════════════════════════════════
   SCENE BUILDER
   Assigns media to scene templates based on count
════════════════════════════════════════════════════════ */
function buildScenes(media){
  if(!media||!media.length) return '';
  let html = '';
  let i = 1; // skip index 0 (hero)

  // scene templates consume 1-2 media items each
  const templates = [
    // A: 2 items — large left + small right overlap
    (items) => {
      if(items.length < 2) return null;
      return `<div class="scene-a">
        <figure class="item sa-main">${makeMedia(items[0])}</figure>
        <figure class="item sa-over">${makeMedia(items[1])}</figure>
        <div class="item sa-cap"><p class="cap">${items[0].caption||''}</p></div>
      </div>`;
    },
    // B: 2 items — collision, text over seam
    (items) => {
      if(items.length < 2) return null;
      return `<div class="scene-b">
        <figure class="item sb-left">${makeMedia(items[0])}</figure>
        <figure class="item sb-right">${makeMedia(items[1])}</figure>
        <div class="item sb-text float-text"><p>${items[0].caption||''}</p></div>
      </div>`;
    },
    // C: 2 items — large + punch from bottom-right
    (items) => {
      if(items.length < 2) return null;
      return `<div class="scene-c">
        <figure class="item sc-main">${makeMedia(items[0])}</figure>
        <figure class="item sc-punch">${makeMedia(items[1])}</figure>
        <div class="item sc-cap"><p class="cap">${items[1].caption||''}</p></div>
      </div>`;
    },
    // D: 2 items — full bleed pan + corner punch
    (items) => {
      if(items.length < 2) return null;
      return `<div class="scene-d">
        <figure class="item sd-pan">${makeMedia(items[0])}</figure>
        <figure class="item sd-punch">${makeMedia(items[1])}</figure>
        <div class="item sd-cap"><p class="cap">${items[0].caption||''}</p></div>
      </div>`;
    },
    // E: 2 items — portrait left, landscape overlapping right
    (items) => {
      if(items.length < 2) return null;
      return `<div class="scene-e">
        <figure class="item se-portrait">${makeMedia(items[0])}</figure>
        <figure class="item se-landscape">${makeMedia(items[1])}</figure>
        <div class="item se-cap"><p class="cap" style="text-align:right;max-width:24ch;">${items[1].caption||''}</p></div>
      </div>`;
    },
    // F: 1 item — single centered standalone
    (items) => {
      return `<div class="scene-f">
        <figure class="item sf-main">${makeMedia(items[0])}</figure>
        <div class="item sf-cap"><p class="cap">${items[0].caption||''}</p></div>
      </div>`;
    },
  ];

  let tIdx = 0;
  const remaining = media.slice(1); // skip hero
  let ri = 0;

  while(ri < remaining.length){
    const tmpl = templates[tIdx % templates.length];
    const chunk = remaining.slice(ri);
    const result = tmpl(chunk);
    if(result){
      html += result;
      // consume: templates A-E use 2, F uses 1
      ri += (tIdx % templates.length === 5) ? 1 : Math.min(2, chunk.length);
    } else {
      // not enough items for this template — use F (single)
      html += templates[5]([remaining[ri]]);
      ri += 1;
    }
    tIdx++;
  }

  return html;
}

/* ════════════════════════════════════════════════════════
   PAGE BUILDER
════════════════════════════════════════════════════════ */
function buildPage(project, id){
  const media = project.media || [];
  const heroItem = media[0];
  const client = project.client || '';
  const title = project.title || '';
  const blurb = project.blurb || '';
  const description = project.description || '';

  // hero
  let heroHTML = '';
  if(heroItem && heroItem.url){
    const heroMedia = isVimeo(heroItem.url)
      ? `<div class="vm" style="view-transition-name:project-hero;">
          <iframe src="https://player.vimeo.com/video/${getVimeoId(heroItem.url)}?background=1&autoplay=1&loop=1&muted=1&controls=0&title=0&byline=0&portrait=0&dnt=1"
                  allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>`
      : `<div class="im" style="view-transition-name:project-hero;">
          <img src="${heroItem.url}" alt="${title}" />
        </div>`;
    heroHTML = `
      <div class="hero">
        ${heroMedia}
        <div class="hero-vignette"></div>
        <div class="hero-title">
          <span class="eyebrow">${client}</span>
          <h1>${title.replace(':',':<br><em>').replace('</em>','').replace(/<br><em>([^<]*)$/,'<br><em>$1</em>')}</h1>
        </div>
        <div class="hero-aside">
          <span>${client}</span>
        </div>
        <div class="scroll-cue"></div>
      </div>`;
  }

  // intro
  const introHTML = (blurb || description) ? `
    <div class="intro">
      <p class="intro-body">${description || blurb}</p>
      ${blurb && description ? `<p class="intro-pull">${blurb}</p>` : ''}
    </div>` : '';

  // scenes
  const scenesHTML = buildScenes(media);

  // closing
  const closingHTML = `
    <div class="closing">
      <div class="closing-tags">
        <span>${client}</span>
      </div>
      <a href="index.html" class="more-work">← More Work</a>
    </div>`;

  return heroHTML + introHTML + `<div class="canvas">${scenesHTML}</div>` + closingHTML;
}

/* ════════════════════════════════════════════════════════
   GATE
════════════════════════════════════════════════════════ */
function showGate(onUnlock){
  const gate = document.getElementById('gate');
  const pwd  = document.getElementById('gate-pwd');
  const hint = document.getElementById('gate-hint');
  gate.style.display = 'flex';

  function attempt(){
    if(pwd.value.toLowerCase().trim() === GATE_PASSWORD){
      setCookie('agc_access','true',7);
      gate.classList.add('dissolve');
      setTimeout(()=>{gate.style.display='none'; onUnlock();},1100);
    } else {
      hint.classList.remove('show');
      void hint.offsetWidth;
      hint.classList.add('show');
      pwd.value=''; pwd.focus();
    }
  }

  document.getElementById('gate-enter').addEventListener('click',attempt);
  pwd.addEventListener('keydown',e=>{
    if(e.key==='Enter') attempt();
    hint.classList.remove('show');
  });
  setTimeout(()=>pwd.focus(),800);
}

/* ════════════════════════════════════════════════════════
   VIMEO LAZY LOADER
════════════════════════════════════════════════════════ */
function initLazyVimeo(){
  // Stash src on all non-hero iframes
  document.querySelectorAll('.vm iframe').forEach((iframe, i) => {
    if(i === 0) return; // hero loads immediately
    const realSrc = iframe.getAttribute('src');
    if(!realSrc) return;
    iframe.removeAttribute('src');
    iframe.dataset.src = realSrc;
  });

  const lazyIO = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){
        const iframe = e.target.querySelector('iframe[data-src]');
        if(iframe){ iframe.src = iframe.dataset.src; delete iframe.dataset.src; }
        lazyIO.unobserve(e.target);
      }
    });
  }, { rootMargin: '300px 0px' });

  document.querySelectorAll('.vm').forEach((vm, i) => {
    if(i === 0) return;
    lazyIO.observe(vm);
  });
}
function initReveal(){
  const items = document.querySelectorAll('.item');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); }
    });
  },{threshold:.06,rootMargin:'0px 0px -40px 0px'});
  items.forEach(el=>io.observe(el));
}

/* ════════════════════════════════════════════════════════
   HOVER REPULSION
════════════════════════════════════════════════════════ */
function initRepulsion(){
  const scenes = document.querySelectorAll('.scene-a,.scene-b,.scene-c,.scene-d,.scene-e,.scene-f');
  function getCenter(el){ const r=el.getBoundingClientRect(); return{x:r.left+r.width/2,y:r.top+r.height/2}; }
  function baseT(el){ return ''; }
  function buildT(el,tx,ty,scale){ return `translate(${tx}px,${ty}px) scale(${scale})`; }

  scenes.forEach(scene=>{
    const members=Array.from(scene.querySelectorAll('.item'));
    members.forEach(el=>{
      el.addEventListener('mouseenter',()=>{
        const hc=getCenter(el);
        members.forEach(sib=>{
          if(sib===el){
            sib.style.transition='transform .45s cubic-bezier(.25,.46,.45,.94),opacity .45s ease';
            sib.style.transform=buildT(sib,0,-3,1.015);
            sib.style.zIndex='10'; sib.style.opacity='1';
          } else {
            const sc=getCenter(sib);
            const dx=sc.x-hc.x,dy=sc.y-hc.y;
            const dist=Math.sqrt(dx*dx+dy*dy)||1;
            const str=Math.min(24,1800/dist);
            sib.style.transition='transform .55s cubic-bezier(.25,.46,.45,.94),opacity .55s ease';
            sib.style.transform=buildT(sib,(dx/dist)*str,(dy/dist)*str,.97);
            sib.style.opacity='.68';
          }
        });
      });
      el.addEventListener('mouseleave',()=>{
        members.forEach(sib=>{
          sib.style.transition='transform .7s cubic-bezier(.25,.46,.45,.94),opacity .7s ease';
          sib.style.transform=''; sib.style.opacity=''; sib.style.zIndex='';
        });
      });
    });
  });
}

/* ════════════════════════════════════════════════════════
   BACK NAVIGATION — view transition
════════════════════════════════════════════════════════ */
function initBackNav(){
  document.querySelector('.more-work')?.addEventListener('click',e=>{
    e.preventDefault();
    if(document.startViewTransition){
      document.startViewTransition(()=>{ window.location.href='index.html'; });
    } else {
      window.location.href='index.html';
    }
  });
}

/* ════════════════════════════════════════════════════════
   TITLE FORMATTER
════════════════════════════════════════════════════════ */
function formatTitle(title){
  // split on : or — for italic second line
  const parts = title.split(/[:—]/);
  if(parts.length > 1){
    return `${parts[0].trim()}:<br><em>${parts.slice(1).join('').trim()}</em>`;
  }
  return title;
}

/* ════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════ */
async function init(){
  const id = getProjectId();

  // fetch project data
  let projects = [];
  try{
    const res = await fetch(PROJECTS_JSON + '?v=' + Date.now());
    const data = await res.json();
    projects = Array.isArray(data) ? data : (data.projects || data.items || []);
  } catch(e){
    console.error('Could not load projects.json', e);
    return;
  }

  const project = projects[id];
  if(!project){ document.getElementById('page-content').innerHTML='<p style="padding:8rem 7vw;color:#5c5a54;">Project not found.</p>'; return; }

  document.title = `A Golden Calf — ${project.title}`;

  function renderPage(){
    const content = document.getElementById('page-content');
    content.innerHTML = buildPage(project, id);
    content.style.opacity = '1';
    initLazyVimeo();
    initReveal();
    // only init repulsion on non-touch
    if(window.matchMedia('(hover:hover)').matches) initRepulsion();
    initBackNav();
  }

  // check gate
  const needsGate = PROTECTED_IDS.includes(id) && getCookie('agc_access') !== 'true';
  if(needsGate){
    showGate(()=>{
      renderPage();
    });
  } else {
    renderPage();
  }
}

init();
