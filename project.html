<!DOCTYPE html>

  <meta charset="UTF-8">

  <title>A Golden Calf</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Desktop: thumbnail morphs into first media item ── */
    @media (hover: hover) {
      ::view-transition-old(project-hero) {
        animation: 480ms cubic-bezier(0.4, 0, 0.2, 1) both vt-fade-out;
      }
      ::view-transition-new(project-hero) {
        animation: 680ms cubic-bezier(0.16, 1, 0.3, 1) both vt-fade-in;
      }
      ::view-transition-old(root) {
        animation: 280ms ease both vt-fade-out;
      }
      ::view-transition-new(root) {
        animation: 420ms ease both vt-fade-in;
      }
    }
    /* ── Mobile: fade through black ── */
    @media (hover: none) {
      ::view-transition-old(root) {
        animation: 300ms ease both vt-fade-out;
      }
      ::view-transition-new(root) {
        animation: 400ms ease 260ms both vt-fade-in;
      }
      :root { background: #0d0e0c; }
    }
    @keyframes vt-fade-in  { from { opacity: 0; } }
    @keyframes vt-fade-out { to   { opacity: 0; } }
  </style>
</head>
